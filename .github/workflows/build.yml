name: Build ZMK Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:3.5
    strategy:
      fail-fast: false
      matrix:
        include:
          # board 2: S140 SoftDevice still resident -> app at 0x26000
          - board: ble_micro_pro
            shield: cocot46lp
            artifact: cocot46lp-firmware-ble_micro_pro
          # board 1: SoftDevice erased -> app at 0x1000
          - board: ble_micro_pro_nosd
            shield: cocot46lp
            artifact: cocot46lp-firmware-ble_micro_pro_nosd
          # settings-reset for board 1: flash this ONCE to wipe all BLE bonds /
          # identities, then flash the normal nosd firmware back and re-pair.
          - board: ble_micro_pro_nosd
            shield: settings_reset
            artifact: settings-reset-board1

    name: Build ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            modules/
            tools/
            zephyr/
            zmk/
          key: west-3.5-${{ hashFiles('config/west.yml') }}

      - name: Initialize west workspace
        run: west init -l config

      - name: Update west modules
        run: west update

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Build firmware
        run: |
          if [ "${{ matrix.shield }}" = "settings_reset" ]; then
            # settings_reset is a stock ZMK shield (no studio/module needed), but
            # ZMK_CONFIG must still be passed so the build can FIND our custom
            # in-config board (ble_micro_pro_nosd). cocot46lp.conf is named after
            # the cocot46lp shield, so it is NOT applied for SHIELD=settings_reset.
            west build -s zmk/app \
              -b ${{ matrix.board }} \
              -- \
              -DSHIELD=settings_reset \
              -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
          else
            west build -s zmk/app \
              -b ${{ matrix.board }} \
              -S studio-rpc-usb-uart \
              -- \
              -DSHIELD=${{ matrix.shield }} \
              -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
              -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/az1uball_driver"
          fi

      - name: Rename artifact
        run: cp build/zephyr/zmk.uf2 ${{ matrix.artifact }}.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.uf2
